<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SorteioMaster - Professional Draws Made Easy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'ui-sans-serif', 'system-ui', '-apple-system', 'BlinkMacSystemFont', '"Segoe UI"', 'Roboto', '"Helvetica Neue"', 'Arial', '"Noto Sans"', 'sans-serif', '"Apple Color Emoji"', '"Segoe UI Emoji"', '"Segoe UI Symbol"', '"Noto Color Emoji"'],
            },
            colors: {
              primary: {
                DEFAULT: '#6d28d9', // violet-700
                light: '#8b5cf6', // violet-500
                dark: '#5b21b6', // violet-800
              },
              secondary: {
                DEFAULT: '#059669', // emerald-600
                dark: '#047857', // emerald-700
              },
              accent: {
                DEFAULT: '#4f46e5', // indigo-600
                dark: '#3730a3', // indigo-800
              },
              light: '#f8fafc', // slate-50
              'light-card': '#ffffff',
              dark: '#020617',      // slate-950
              'dark-card': '#0f172a', // slate-900
              'dark-border': '#1e293b', // slate-800
              'dark-text': '#e2e8f0', // slate-200
            },
            boxShadow: {
                'card': '0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -2px rgba(0,0,0,0.1)',
                'card-hover': '0 10px 15px -3px rgba(0,0,0,0.1), 0 4px 6px -4px rgba(0,0,0,0.1)',
                'inner-soft': 'inset 0 2px 4px 0 rgba(0,0,0,0.05)',
            },
            keyframes: {
              reveal: {
                '0%': { transform: 'translateY(10px)', opacity: '0' },
                '100%': { transform: 'translateY(0px)', opacity: '1' },
              },
              'pop-in': {
                '0%': { transform: 'scale(0.7)', opacity: '0' },
                '50%': { transform: 'scale(1.05)', opacity: '1' },
                '100%': { transform: 'scale(1)', opacity: '1' },
              },
              'spinner-rotate': {
                '0%': { transform: 'rotate(0deg)' },
                '100%': { transform: 'rotate(360deg)' },
              },
              fadeIn: {
                '0%': { opacity: '0' },
                '100%': { opacity: '1' },
              },
              scaleIn: {
                 '0%': { opacity: '0', transform: 'scale(0.9)' },
                '100%': { opacity: '1', transform: 'scale(1)' },
              },
              float: {
                '0%, 100%': { transform: 'translateY(0px)' },
                '50%': { transform: 'translateY(-8px)' },
              },
              'gradient-pan': {
                '0%': { 'background-position': '0% 50%' },
                '50%': { 'background-position': '100% 50%' },
                '100%': { 'background-position': '0% 50%' },
              }
            },
            animation: {
              reveal: 'reveal 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards',
              'pop-in': 'pop-in 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards',
              'spinner-rotate': 'spinner-rotate 0.8s linear infinite',
              fadeIn: 'fadeIn 0.3s ease-out forwards',
              scaleIn: 'scaleIn 0.3s ease-out',
              float: 'float 3s ease-in-out infinite',
              'gradient-pan': 'gradient-pan 10s ease infinite',
            },
          },
        },
      }
    </script>
  <script type="importmap">
{
  "imports": {
    "react": "https://aistudiocdn.com/react@^19.1.1",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.1.1/",
    "react/": "https://aistudiocdn.com/react@^19.1.1/",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.21.0",

    "html2canvas": "https://aistudiocdn.com/html2canvas@^1.4.1"
  }
}
</script>
